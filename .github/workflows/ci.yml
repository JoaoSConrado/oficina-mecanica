name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes + JaCoCo (mínimo de 80% nos domínios críticos)
        run: ./mvnw -B verify
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco

  vulnerabilidades:
    name: Análise de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Varredura de dependências, segredos e configuração
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
      - name: Varredura da imagem Docker
        run: docker build -t oficina-mecanica:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oficina-mecanica:ci
          format: table
          output: trivy-imagem.txt
          severity: CRITICAL,HIGH
      - name: Publica relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-vulnerabilidades
          path: trivy-*.txt
      - name: Resumo no job
        if: always()
        run: |
          for arquivo in trivy-report.txt trivy-imagem.txt; do
            [ -f "$arquivo" ] || continue
            echo "### $arquivo" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$arquivo" ]; then cat "$arquivo" >> "$GITHUB_STEP_SUMMARY"; else echo "Nenhum achado nas severidades analisadas." >> "$GITHUB_STEP_SUMMARY"; fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          cat trivy-*.txt 2>/dev/null || true
