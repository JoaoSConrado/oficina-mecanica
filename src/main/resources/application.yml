spring:
  application:
    name: oficina-mecanica
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

oficina:
  seguranca:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiracao: ${JWT_EXPIRACAO:PT2H}
    admin-usuario: ${ADMIN_USERNAME:admin}
    admin-senha: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-stacktrace: never
